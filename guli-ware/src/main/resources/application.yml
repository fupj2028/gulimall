server:
  port: 13000

spring:
  application:
    name: guli-ware
  config:
    import:
      - optional:nacos:gulimall.yaml
      - optional:nacos:guli-ware-dev.yaml
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    virtual-host: /
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        username: nacos
        password: nacos
      config:
        server-addr: localhost:8848
        namespace: 788dc2fc-6986-4479-8534-9f9e875dd426
        username: nacos
        password: nacos
